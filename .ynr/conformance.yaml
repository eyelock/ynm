# ynr conformance for ynm (ynr ADR-008): `make conformance` runs it, and CI's Conformance job.
# Each scenario runs the ynm CLI against a throwaway store (YNM_HOME in a fresh temp folder): no
# model, no secret, no network. The planted canary is the memory's content; the check fails if it
# reaches a telemetry record.
#
# Sealed from the machine's secrets: every scenario runs from a fresh folder that is not a git
# repository, so ynm loads no repository .env (the main checkout's, from a worktree), and with the
# model keys and endpoint cleared (env -u), so a key in your shell changes nothing either. A local
# run gives CI's result. packages/cli/test/conformance-sealed.test.ts holds this to account.
service: ynm
registry: telemetry/registry
scenarios:
  - name: remember, a memory in a throwaway store
    run: cd "$(mktemp -d)" && env -u TYPESAFE_API_KEY -u OPENAI_API_KEY -u YNM_OPENAI_BASE_URL YNM_NO_CLAUDE_CLI=1 YNM_HOME="$(mktemp -d)" ynm remember --type semantic --content @canary:memory
    expect: { outcome: ok }
  - name: serve, one tool call over stdio
    run: >-
      printf '%s\n'
      '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"conformance","version":"0"}}}'
      '{"jsonrpc":"2.0","method":"notifications/initialized"}'
      '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"memory_remember","arguments":{"type":"semantic","content":"@canary:memory"}}}'
      | (cd "$(mktemp -d)" && env -u TYPESAFE_API_KEY -u OPENAI_API_KEY -u YNM_OPENAI_BASE_URL YNM_NO_CLAUDE_CLI=1 YNM_HOME="$(mktemp -d)" ynm serve)
    expect: { outcome: ok }
  - name: dream, one run with no model
    run: cd "$(mktemp -d)" && env -u TYPESAFE_API_KEY -u OPENAI_API_KEY -u YNM_OPENAI_BASE_URL YNM_NO_CLAUDE_CLI=1 YNM_HOME="$(mktemp -d)" ynm dream
    expect: { outcome: ok }
