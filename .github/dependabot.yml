version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      # Alone, because its pin in telemetry/registry moves with `make gen` (the generator refuses
      # a mismatch), and a bump may add or drop attributes the registry uses.
      semconv:
        patterns: ["@opentelemetry/semantic-conventions"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["@opentelemetry/semantic-conventions"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "docker-compose"
    directory: "/infra/keycloak"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  # One weekly pull request for every Terraform root's providers, while CI runs cost money.
  - package-ecosystem: "terraform"
    directories:
      - "/infra/github"
      - "/infra/auth0"
      - "/infra/aws/baseline"
      - "/infra/aws/lambda"
      - "/infra/aws/server"
      - "/infra/terraform-state"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
