name: ci

on:
  push:
    branches: [main, develop, 'hotfix/*']
  # No branch filter: CI runs on every pull request, including one based on another feature
  # branch, so a stacked PR is gated like any other.
  pull_request:

permissions:
  contents: read
  packages: read

# @eyelock/otel-spool-exporter is public on GitHub's npm registry, which still wants a token even
# to read a public package. Each job that installs sets NODE_AUTH_TOKEN to the workflow's own
# GITHUB_TOKEN (packages: read, granted above) and points the runner's ~/.npmrc at it; the single
# quotes keep ${NODE_AUTH_TOKEN} out of the file, so npm expands it at install time. The project
# .npmrc names only the registry. Fork and Dependabot pull requests work too: they get a
# read-only GITHUB_TOKEN, which is enough to read a public package.
env:
  # The ynr release that `conformance` runs, without the leading v. The one place it is pinned.
  YNR_VERSION: 0.5.0

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read @eyelock packages from GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - run: make deps
      - run: make build
      - run: make verify
      - name: Milestone gate
        env:
          MILESTONE: ${{ vars.YNM_MILESTONE || 'M0' }}
        run: make gate M="$MILESTONE"

  # A pull request into main is a release or hotfix: it must pass the release gate the tag would
  # run, including the check that the frozen evals did not regress against the previous release.
  # Part of All Clear, which main requires (infra/github/branches.tf), so a release cannot merge
  # with a regression.
  release-gate:
    name: release gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read @eyelock packages from GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - run: make deps
      - run: make build
      - name: Release gate
        run: make gate M=M6

  # Gates on the lines a pull request adds or modifies, not on overall totals.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read @eyelock packages from GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - run: make deps
      - run: make build
      - run: make coverage
      - name: Coverage of changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make coverage-diff BASE="origin/$BASE_REF"

  # NVIDIA SkillSpector over the agent skills and the ynh harness manifest, through
  # eyelock/actions/skillspector. Any finding not accepted in .skillspector-baseline.yaml fails.
  # On a pull request only what changed is scanned; a baseline change scans everything.
  skillspector:
    name: SkillSpector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: eyelock/actions/skillspector@2b4b0eafc45da186506a6fd72774482b636d55aa  # skillspector-v1.1.0
        with:
          include: |
            integrations/ynh

  # ynr conformance (ynr ADR-008): ynm's own scenarios, offline, against a pinned ynr release.
  # ynm finds ynr only on PATH, so it is put there from the release, never built or installed from
  # a package manager.
  conformance:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read @eyelock packages from GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - name: ynr, checked against the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/ynr-download"
          bin="$RUNNER_TEMP/ynr-bin"
          mkdir -p "$dl" "$bin"
          ynr="ynr_${YNR_VERSION}_linux_amd64.tar.gz"
          gh release download "v${YNR_VERSION}" -R eyelock/ynr -D "$dl" -p "$ynr" -p checksums.txt
          cd "$dl"
          grep -E " ${ynr}\$" checksums.txt > wanted.txt
          [ "$(wc -l < wanted.txt)" -eq 1 ]
          sha256sum --check --strict wanted.txt
          tar -xzf "$ynr" -C "$bin" ynr
          echo "$bin" >> "$GITHUB_PATH"
      - run: make deps
      - run: make build
      - name: ynr conformance
        run: |
          set -euo pipefail
          ynr version
          make conformance CONFORMANCE_FORMAT=json | tee "$RUNNER_TEMP/conformance.json"

  # The one check the rulesets require (infra/github/branches.tf). It runs even when a job it
  # needs fails, because a skipped required check counts as passing. Skipped jobs are fine:
  # release-gate and coverage only run on some pull requests.
  all-clear:
    name: All Clear
    needs: [verify, release-gate, coverage, skillspector, conformance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more checks failed"
              exit 1
            fi
          done
          echo "All checks passed"
