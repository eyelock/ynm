name: ci

on:
  push:
    branches: [main, develop, 'hotfix/*']
  # No branch filter: CI runs on every pull request, including one based on another feature
  # branch, so a stacked PR is gated like any other.
  pull_request:

permissions:
  contents: read

# Each job that installs sets YNR_READ_PACKAGES and points the runner's ~/.npmrc at it:
# @eyelock/otel-spool-exporter comes from GitHub Packages, which needs a token with read:packages
# even to read. The project .npmrc names only the registry, so a contributor's token in their own
# ~/.npmrc works too. Dependabot and fork pull requests cannot read Actions secrets, so their
# installs fail until YNR_READ_PACKAGES is also a Dependabot secret.
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      YNR_READ_PACKAGES: ${{ secrets.YNR_READ_PACKAGES }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read @eyelock packages from GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${YNR_READ_PACKAGES}' >> ~/.npmrc
      - run: make deps
      - run: make build
      - run: make verify
      - name: Milestone gate
        env:
          MILESTONE: ${{ vars.YNM_MILESTONE || 'M0' }}
        run: make gate M="$MILESTONE"

  # A pull request into main is a release or hotfix: it must pass the release gate the tag would
  # run, including the check that the frozen evals did not regress against the previous release.
  # Part of All Clear, which main requires (infra/github/branches.tf), so a release cannot merge
  # with a regression.
  release-gate:
    name: release gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      YNR_READ_PACKAGES: ${{ secrets.YNR_READ_PACKAGES }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read @eyelock packages from GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${YNR_READ_PACKAGES}' >> ~/.npmrc
      - run: make deps
      - run: make build
      - name: Release gate
        run: make gate M=M6

  # Gates on the lines a pull request adds or modifies, not on overall totals.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      YNR_READ_PACKAGES: ${{ secrets.YNR_READ_PACKAGES }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read @eyelock packages from GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${YNR_READ_PACKAGES}' >> ~/.npmrc
      - run: make deps
      - run: make build
      - run: make coverage
      - name: Coverage of changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make coverage-diff BASE="origin/$BASE_REF"

  # The one check the rulesets require (infra/github/branches.tf). It runs even when a job it
  # needs fails, because a skipped required check counts as passing. Skipped jobs are fine:
  # release-gate and coverage only run on some pull requests.
  all-clear:
    name: All Clear
    needs: [verify, release-gate, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more checks failed"
              exit 1
            fi
          done
          echo "All checks passed"
