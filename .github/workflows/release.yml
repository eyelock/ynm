name: release

# Tag v<version> (after `pnpm changeset version` has bumped the packages) to publish:
# a GitHub release with the self-contained CLI tarball, the Homebrew formula in
# github.com/eyelock/homebrew-tap, and the hosted image on ghcr.io.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Release gate
        run: pnpm gate M6
        env:
          YNM_CI_RELEASE: "1"

  release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release/pack.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 dist-release/ynm-$VERSION.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
      - name: Smoke the tarball
        run: |
          tar -xzf dist-release/ynm-${{ steps.meta.outputs.version }}.tar.gz -C /tmp
          /tmp/ynm-${{ steps.meta.outputs.version }}/ynm --version
          /tmp/ynm-${{ steps.meta.outputs.version }}/ynm serve --help
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/ynm-${{ steps.meta.outputs.version }}.tar.gz
            dist-release/ynm-${{ steps.meta.outputs.version }}.tar.gz.sha256
          generate_release_notes: true

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eyelock/homebrew-tap
          token: ${{ secrets.RELEASE_TOKEN }}
          path: tap
      - name: Update Formula/ynm.rb
        run: |
          node scripts/release/formula.mjs "${{ needs.release.outputs.version }}" "${{ needs.release.outputs.sha256 }}" > tap/Formula/ynm.rb
          cd tap
          git config user.name "ynm-release[bot]"
          git config user.email "ynm-release@users.noreply.github.com"
          git add Formula/ynm.rb
          git commit -m "Brew formula update for ynm version v${{ needs.release.outputs.version }}"
          git push

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eyelock/ynm:${{ needs.release.outputs.version }}
            ghcr.io/eyelock/ynm:latest
