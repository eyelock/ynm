name: Protect Main

# main only moves by release: PRs into it come from develop, release/* or hotfix/*.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  # Required by main's ruleset, so it must report on the merge queue's ref too.
  merge_group:
    branches: [main]

jobs:
  check-source-branch:
    name: Verify PR source branch
    runs-on: ubuntu-latest
    steps:
      - name: Check that PR targets main only from develop, hotfix/*, or release/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          # A queue entry has no head branch: the pull request already passed this check to enter.
          if [[ "$EVENT" == "merge_group" ]]; then
            echo "Merge queue entry: source branch was checked when the pull request was queued"
            exit 0
          fi
          SOURCE="$HEAD_REF"
          echo "PR source branch: $SOURCE"

          if [[ "$SOURCE" == "develop" ]] || [[ "$SOURCE" == hotfix/* ]] || [[ "$SOURCE" == release/* ]]; then
            echo "✅ Source branch '$SOURCE' is allowed to target main"
          else
            echo "❌ PRs to main must come from 'develop', 'hotfix/*', or 'release/*'"
            echo "   Source branch '$SOURCE' is not allowed."
            echo "   Open your PR against 'develop' instead."
            exit 1
          fi
